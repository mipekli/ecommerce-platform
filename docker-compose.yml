version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce-sqlserver
    environment:
      SA_PASSWORD: "Passw0rd!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./docker/sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Passw0rd!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ecommerce-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ecommerce-jaeger
    ports:
      - "4317:4317"
      - "4318:4318"
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  identity-api:
    build:
      context: ./src
      dockerfile: Services/Identity/Identity.API/Dockerfile
    container_name: ecommerce-identity-api
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped

  product-api:
    build:
      context: ./src
      dockerfile: Services/Product/Product.API/Dockerfile
    container_name: ecommerce-product-api
    ports:
      - "5002:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped

  order-api:
    build:
      context: ./src
      dockerfile: Services/Order/Order.API/Dockerfile
    container_name: ecommerce-order-api
    ports:
      - "5003:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped

  inventory-api:
    build:
      context: ./src
      dockerfile: Services/Inventory/Inventory.API/Dockerfile
    container_name: ecommerce-inventory-api
    ports:
      - "5004:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped

  notification-api:
    build:
      context: ./src
      dockerfile: Services/Notification/Notification.API/Dockerfile
    container_name: ecommerce-notification-api
    ports:
      - "5005:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped

  api-gateway:
    build:
      context: ./src
      dockerfile: ApiGateway/Dockerfile
    container_name: ecommerce-api-gateway
    ports:
      - "5000:8080"
    depends_on:
      - identity-api
      - product-api
      - order-api
      - inventory-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped

volumes:
  sqlserver-data:
